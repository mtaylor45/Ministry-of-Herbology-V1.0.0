<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8dcc2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      /* Apply the stored theme before the first paint, so nobody standing in a
         dark greenhouse at 6am gets a flash of parchment. The key, the theme
         names, the default and the colours match web/src/lib/ui/theme.ts;
         contrast.test.ts keeps the two in step.

         No stored choice means parchment, whatever the device prefers. The device is followed only by someone who asked for it by
         storing "system" — there is no prefers-color-scheme rule in the
         stylesheet any more, so this script is the only thing that follows it. */
      (function () {
        try {
          var stored = localStorage.getItem('moh-theme');
          var theme = 'parchment';
          if (stored === 'parchment' || stored === 'greenhouse') {
            theme = stored;
          } else if (stored === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'greenhouse'
              : 'parchment';
          }
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme === 'greenhouse' ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'greenhouse' ? '#111722' : '#e8dcc2');
        } catch (error) {
          /* storage blocked: the stylesheet's :root block is already parchment */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
