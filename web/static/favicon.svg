<?xml version="1.0" encoding="UTF-8"?>
<!--
  The app icon: the seal's central device, alone.

  Same mark as web/static/seal.svg — one seal, by design — at the density a
  16px tab can carry. The inscription, the laurel and the stars go, because a
  ring of 5pt lettering at favicon size is a grey smudge; the lantern stays, at
  heavier strokes so it survives the first rounding. The original-theme rule applies here exactly
  as it does to the full seal: no crest, no monogram, no initial, no franchise
  emblem.

  Antique Gold #B89A5A on Forest Green #19382F is 4.74:1, and the Warm Ivory
  flame 10.91:1 — both past the 3:1 an icon's shapes need.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="The Ministry of Herbology: a lantern"
>
  <rect width="64" height="64" rx="5" fill="#19382f" />
  <rect x="3" y="3" width="58" height="58" rx="3" fill="none" stroke="#b89a5a" stroke-width="2" />

  <g fill="none" stroke="#b89a5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="14.5" r="3.4" />
    <path d="M32 17.9 v3.2" />
    <path d="M25 25.6 L39 25.6 L44 32 L20 32 Z" />
    <path d="M22.4 35.4 L41.6 35.4" stroke-width="2.6" />
    <path d="M23.6 35.4 v11.4 a6.4 6.4 0 0 0 6.4 6.4 h4 a6.4 6.4 0 0 0 6.4 -6.4 v-11.4" />
  </g>
  <path
    d="M32 37.4 C35.6 42.2 36.6 45.5 34.4 47.9 C33.1 49.5 30.9 49.5 29.6 47.9 C27.4 45.5 28.4 42.2 32 37.4 Z"
    fill="#f4edda"
  />
</svg>
