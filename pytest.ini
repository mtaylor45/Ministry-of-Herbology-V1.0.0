# Repository-root pytest configuration. Owner: The maintainers (cross-cutting).
#
# This file exists for one reason: to make the repository root the rootdir.
#
# `api/pyproject.toml` carried the only `[tool.pytest.ini_options]` in the tree,
# so pytest chose `api/` as the rootdir — and `confcutdir` defaults to the
# rootdir, which means the repository-root `conftest.py` was **never loaded**
# for anything under `tests/`. That conftest puts `workers` on `sys.path` and
# its docstring says "Both invocations now behave the same"; for the `tests/`
# tree the claim was false, and had been since it was written.
#
# Nothing noticed, because no module under `tests/` imported `workers`
# at import time — the one that did deferred it into a test body. The moment a
# `skipif` needed `workers.weather.settings` at collection time, CI went red
# with `ModuleNotFoundError: No module named 'workers'` while the same suite
# passed when run as `pytest tests/e2e` on its own. A config that makes a suite
# pass or fail depending on which sibling directories share the command line is
# a trap, and this removes it rather than working around it.
#
# `asyncio_mode` is repeated from `api/pyproject.toml` deliberately: it used to
# be "whatever the caller's rootdir happens to say", which is what several
# worker conftests wrote workarounds against. Now one rootdir says it.
#
# Note for anyone adding tests: there are still no `__init__.py` files under the
# test trees, so a test module's basename must remain unique repository-wide.
# Two `test_http.py` files still collide and still stop collection — that has
# not changed, and the project conventions still says so.
[pytest]
asyncio_mode = auto
testpaths = tests api workers scripts
norecursedirs = .venv .git node_modules web docs contracts fixtures infra .pytest_cache __pycache__
