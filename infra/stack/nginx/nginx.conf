# The Ministry of Herbology — front door. The deployment.
#
# One origin. The web app is at /, the API is at /api/, and they share a scheme,
# a host and a port. That is not tidiness: the PWA's service worker scope, the
# cookies and the CSP below all key off the origin, and splitting the API onto
# its own hostname would mean CORS, a second certificate and a second thing to
# get wrong. the design puts the whole stack behind one Nginx and this is it.
#
# Certificates are the operator's. This file expects two swarm secrets mounted
# at /run/secrets/moh_tls_cert and /run/secrets/moh_tls_key, and nothing in this
# repository generates, bundles or suggests one. docs/deploy/README.md says how.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $remote_addr is the true client only because the stack publishes 80 and
    # 443 in `host` mode. Through the swarm routing mesh every request appears
    # to come from an ingress address instead, which makes an access log
    # useless for telling a phone on the sofa from the open internet.
    log_format moh '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'rt=$request_time uct=$upstream_connect_time '
                   'urt=$upstream_response_time';
    access_log /dev/stdout moh;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    # Photographs of plants, and floor plans. The API enforces its own limit;
    # this one only stops Nginx buffering something absurd to disk first.
    client_max_body_size 32m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Docker's embedded DNS, so a service that restarts on a new IP is found
    # again rather than cached forever as unreachable.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Websockets need Connection: upgrade; keepalive to an upstream needs
    # Connection to be empty. One map serves both, per request.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # The backends are named in variables rather than in `upstream` blocks, and
    # that is a deliberate trade rather than an oversight.
    #
    # Nginx resolves a literal upstream host once, at startup, and refuses to
    # start at all if it does not resolve — `host not found in upstream`. In a
    # swarm every service is created at the same moment, so the front door
    # would crash-loop until the API happened to win the race. Worse, scaling
    # the API to zero, or an API that cannot start, would take Nginx down with
    # it and leave the operator with no server to ask what went wrong.
    #
    # With the host in a variable, Nginx resolves it per request through
    # Docker's DNS. A missing backend then answers 502 — which is a diagnosis —
    # and the front door is up to say so.
    #
    # What this costs: no upstream keepalive, and no max_fails/fail_timeout
    # ejection. At one household's traffic, a fresh connection per request is
    # not the bottleneck, and with one replica there is nothing to eject.

    # Everything on :80 is redirected, except the ACME challenge path. If the
    # operator renews with a webroot challenge they need that one location to
    # answer over plain HTTP; if they renew some other way it simply never gets
    # used. Nothing here obtains a certificate.
    server {
        # IPv4 only. Docker gives a container no IPv6 address unless the
        # daemon is configured for it, and `listen [::]:80` is not a no-op
        # there — Nginx refuses to start with "Address family not supported by
        # protocol". An operator running an IPv6-enabled daemon can add the
        # [::] lines here and to the TLS server below.
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        # The container's own liveness check, on plain HTTP so it needs no
        # certificate and no hostname. It answers for Nginx only and says
        # nothing about the API or the database, which is the point: it is
        # what tells the swarm whether the front door itself is up.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /run/secrets/moh_tls_cert;
        ssl_certificate_key /run/secrets/moh_tls_key;

        # TLS 1.2 and 1.3 only. 1.0 and 1.1 are deprecated and a self-hosted
        # app has no ancient client to keep happy.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:MOH:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS is commented out on purpose. Turning it on tells every browser
        # that has ever visited to refuse plain HTTP to this host for two
        # years, and an operator who later moves the app, or serves it on a LAN
        # name without a certificate, cannot take it back. Uncomment it once
        # the certificate is renewing reliably and the hostname is settled.
        # add_header Strict-Transport-Security "max-age=63072000" always;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # No camera, no microphone, no payment. Geolocation is left available:
        # a site's coordinates are something the operator may want to fill in
        # from the device rather than type.
        add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;

        location /api/ {
            set $moh_api api:8000;
            proxy_pass http://$moh_api;
            include /etc/nginx/moh-proxy.conf;
            # The Almanac's history queries and a first taxon resolution are
            # both slower than a default 60s would forgive.
            proxy_read_timeout 120s;
        }

        # The ICS feed is the one unauthenticated surface with a bearer secret
        # in the URL. Keeping it out of the access log stops a
        # calendar token being readable to anyone who can read logs — which, on
        # a self-hosted box, is usually a backup.
        #
        # This guarded `/api/v1/feeds/` until 2026-09-24, which no route has
        # ever served: the token path is `/api/v1/calendar/{token}.ics` and the
        # management route is `/api/v1/tending/feeds`. Every fetch was falling
        # through to `location /api/` and writing the credential into
        # `$request`. The intent was right and the prefix was wrong, which is
        # the worst combination — the comment said the risk was handled.
        #
        # Both paths are listed now. The management route returns webcal URLs
        # with the tokens inside them, so its *responses* carry credentials even
        # though its own path does not.
        location /api/v1/calendar/ {
            access_log off;
            set $moh_calendar api:8000;
            proxy_pass http://$moh_calendar;
            include /etc/nginx/moh-proxy.conf;
            proxy_read_timeout 60s;
        }

        location /api/v1/tending/feeds {
            access_log off;
            set $moh_feeds api:8000;
            proxy_pass http://$moh_feeds;
            include /etc/nginx/moh-proxy.conf;
            proxy_read_timeout 60s;
        }

        location / {
            set $moh_web web:3000;
            proxy_pass http://$moh_web;
            include /etc/nginx/moh-proxy.conf;
            proxy_read_timeout 60s;
        }
    }
}
