# Shared proxy settings. The deployment.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# Upgrade headers, so a websocket survives the hop. `$connection_upgrade` is
# the map in nginx.conf: `upgrade` for a websocket, empty otherwise.
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_buffering on;
# proxy_read_timeout is deliberately not set here: each location picks its own,
# and nginx rejects the directive appearing twice in one block.
