# The Ministry of Herbology — MQTT broker. The deployment.
#
# The hub worker publishes readings and states here for Home Assistant to pick
# up. Two rules apply to everything on this broker,
# and they are the operator's to hold as much as the code's:
#
#   * An MQTT payload never carries a token or an API key. Readings and states
#     only. If a credential would help a subscriber, the subscriber is asking
#     the wrong question.
#   * A calendar-feed token is the only credential this application issues, and
#     it travels over HTTPS in a URL, never through here.
#
# Anonymous access is off. The dev compose runs `mosquitto-no-auth.conf`
# because nothing there is real; a broker reachable from a home LAN with
# anonymous writes enabled lets anything on the network invent a soil-moisture
# reading, and the watering schedule believes it.

listener 1883
protocol mqtt

allow_anonymous false
password_file /run/secrets/moh_mqtt_passwords

# Persist the retained discovery messages and the queued sessions, so a broker
# restart does not make every entity vanish from Home Assistant until the next
# publish.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Docker collects stdout; a log file inside the container helps nobody.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# A reading is small and there is no reason to accept anything that is not.
message_size_limit 262144

# Websockets are not enabled. Home Assistant and the hub worker both speak
# plain MQTT, and an unused listener is another door.
